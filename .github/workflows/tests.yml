name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]
        laravel: ['11', '12', '13']
        dependency-version: [prefer-stable, prefer-lowest]
        include:
          - laravel: '11'
            testbench: '^9.10'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_AUDIT_ABANDONED: ignore
        run: |
          composer config --no-plugins allow-plugins.pestphp/pest-plugin true || true
          composer config audit.abandoned ignore || true
          composer config --json audit.ignore '["PKSA-m5cs-t1y6-qpcs","PKSA-3r5d-mb8f-1qw9","PKSA-mdq4-51ck-6kdq","PKSA-8qx3-n5y5-vvnd","PKSA-q46n-4fdk-zjr4","PKSA-qzrn-rnz3-85w1","PKSA-w7xr-vk7n-rstm"]' || true
          composer config audit.block false || true
          composer config --json policy.advisories.block false || true
          composer require "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/console:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-audit

      - name: Execute tests
        run: vendor/bin/phpunit
